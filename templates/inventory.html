{% extends "base.html" %}
{% block title %}库存 · 冰箱食材管家{% endblock %}

{% block content %}
<h1>冰箱库存</h1>
<form method="post" action="/inventory/add" class="inline-form">
  <input name="name" placeholder="食材名称" required />
  <input name="quantity" type="number" step="0.1" placeholder="数量" required />
  <input name="unit" placeholder="单位，如 个 / 克" />
  <button type="submit">加入库存</button>
</form>

<table class="table">
  <thead>
    <tr><th>食材</th><th>数量</th><th>单位</th><th>更新时间</th></tr>
  </thead>
  <tbody>
  {% for item in items %}
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.unit }}</td>
      <td>{{ item.updatedAt }}</td>
    </tr>
  {% else %}
    <tr><td colspan="4">库存为空，先添加一些食材吧。</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
